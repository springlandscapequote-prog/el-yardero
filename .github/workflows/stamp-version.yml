# Keeps version.js / version.json / the ?v= tags in sync on every push to main, so the
# "New version ready!" auto-update always sees a new version. Nothing to remember.
name: Stamp version
on:
  push:
    branches: [main]
    paths-ignore: ['version.js', 'version.json']
permissions:
  contents: write
  pages: write
concurrency:
  group: stamp-version
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp
        run: sh tools/stamp.sh
      - name: Commit and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: stamp version [skip ci]"
            git pull --rebase origin main
            git push origin main
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          else
            echo "version already up to date"
          fi
